# Netlify configuration — Federation of Polish Student Societies in the UK
#
# The site is GENERATED by Eleventy and published from dist/.
#
# `command` and `publish` are inseparable. dist/ is gitignored and is not in the
# repository, so Netlify's checkout contains no dist/ at all: without the build
# command it would publish an empty directory and the site would go down.
# Changing one of these two lines without the other is an outage, not a partial
# cutover. See docs/CUTOVER_READINESS.md §14.
#
# `npm run build:production` rather than `npm run build`: it sets
# CMS_TARGET=production, which is the ONLY thing that puts the content manager
# into dist/admin/ and points it at the same-origin /api/cms function. A plain
# `npm run build` still produces a site with no admin panel at all, which is
# what every local build and every test does. See docs/CMS_PRODUCTION.md §3.
#
# Node comes from `engines.node` (">=18") in package.json; Eleventy 3 requires
# Node 18 or newer. There is deliberately no .nvmrc — package.json is the single
# tracked declaration.
#
# The repository root still holds the previous hand-written HTML. It is NOT
# served any more, and is kept deliberately as the rollback surface and as the
# baseline the comparison suites diff against.
#
# The production branch (`main`) is set in the Netlify UI, not here — Netlify
# takes the production branch from site settings, so declaring it in this file
# would have no effect.

[build]
  command = "npm run build:production"
  publish = "dist"
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# The content manager's API
#
# Two functions, on paths the admin already uses:
#
#   /api/cms        Decap's built-in `proxy` backend posts here. It accepts a
#                   root-relative proxy_url, so this is SAME-ORIGIN — the
#                   session cookie is sent, and there is no CORS surface.
#   /api/bulk/*     the Bulk manage screen from Phase 17C.5B, unchanged. The
#                   same four paths are served locally by scripts/cms-server.js
#                   and here by a function.
#
# Both verify the signed-in user and their role server-side on every request.
# Neither accepts a repository path from the browser.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/cms"
  to = "/.netlify/functions/cms"
  status = 200

[[redirects]]
  from = "/api/bulk/*"
  to = "/.netlify/functions/bulk"
  status = 200

# ---------------------------------------------------------------------------
# Who may open the content manager
#
# Netlify checks the role in the `nf_jwt` cookie AT THE EDGE, before any file is
# served. The first rule passes the request through for an editor or an admin;
# anyone else falls through to the second and is sent to the login page.
#
# ORDER MATTERS: Netlify uses the first matching rule, so the role-conditioned
# one has to come first. Swapping them would send signed-in editors to the login
# page forever.
#
# This is real access control, not obscurity. /admin/ is a publicly guessable
# address and that is fine — what protects it is that accounts are invite-only,
# that roles are assigned by an administrator, and that every write function
# checks the role again for itself. An attacker who reaches the admin page
# without a session gets a CMS that cannot read or write anything.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  conditions = {Role = ["editor", "admin"]}

[[redirects]]
  from = "/admin/*"
  to = "/staff-login/"
  status = 302

# ---------------------------------------------------------------------------
# Polish 404
#
# Netlify serves the root /404.html automatically, but it has no concept of a
# per-directory 404. Without this rule a visitor who mistypes a Polish URL gets
# the ENGLISH 404 page.
#
# This is deliberately NOT `force = true`. Netlify applies redirect rules only
# after it has failed to find a matching static file, so every real page under
# /pl/ (pl/index.html, pl/events.html, …) is served normally and this rule only
# catches genuine misses. Adding `force = true` would intercept the whole Polish
# site and break it.
#
# `status = 404` makes Netlify return the page with a real 404 status rather
# than redirecting, so search engines see a not-found response, not a 200.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/pl/*"
  to = "/pl/404.html"
  status = 404

# ---------------------------------------------------------------------------
# Security headers
#
# Applied to the operational routes only. The public pages are unchanged: this
# phase does not alter how any existing page is served, and a site-wide CSP
# added in passing would be a change nobody had reviewed against the real
# stylesheets, embeds and Instagram scripts those pages use.
# ---------------------------------------------------------------------------

# The content manager.
#
# frame-ancestors 'none' — nothing may put the CMS in an iframe, so a page on
# another site cannot overlay it and harvest clicks from a signed-in editor.
#
# The CSP is deliberately permissive about scripts and styles INSIDE the admin:
# Decap is a bundled application that generates styles at runtime and lazily
# loads about ninety of its own chunks. 'unsafe-inline' and 'unsafe-eval' are
# what it needs to run at all, and a policy that broke the editor would simply
# be turned off. connect-src is where the real restriction is — the admin may
# talk to its own origin and to Netlify Identity, and nowhere else.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://identity.netlify.com; frame-src 'self' https://www.instagram.com https://www.facebook.com https://www.linkedin.com"

# The login page.
#
# Stricter than the admin, because it does one thing and loads NO third-party
# script: @netlify/identity is bundled from the pinned package and served from
# this origin, so script-src is 'self' alone. That is the security benefit of
# having replaced the CDN-hosted legacy widget.
#
# connect-src still allows Netlify Identity, because that is where the library
# sends the e-mail address and password. OAuth is a full-page REDIRECT to the
# provider, not a popup or a frame, so form-action covers it and frame-src is
# not needed for sign-in at all.
[[headers]]
  for = "/staff-login/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://identity.netlify.com https://accounts.google.com; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://identity.netlify.com; frame-src 'none'"

# The API. Never a document, never framed, never cached.
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
