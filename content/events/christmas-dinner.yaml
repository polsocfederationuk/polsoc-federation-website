  seo_description: Doroczna Kolacja Wigilijna Federacji w Ognisku Polskim w South Kensington — 100 polskich studentów, tradycyjna wigilia i wspólne kolędowanie.
  schema_name: Doroczna Kolacja Wigilijna 2025
  schema_description: Doroczna Kolacja Wigilijna Federacji dla 100 polskich studentów w Ognisku Polskim w South Kensington, z tradycyjną trzydaniową wigilią i wspólnym kolędowaniem.
  og_image_alt: Studenci przy stołach oświetlonych świecami podczas wigilii w Ognisku Polskim
  body: |-
    Nasza doroczna, flagowa Kolacja Wigilijna zgromadziła 100 polskich studentów w restauracji Ognisko Polskie w South Kensington. Goście zasiedli do tradycyjnej, trzydaniowej kolacji, a potem przyszedł czas na rozmowy i wspólne kolędowanie — namiastka polskich świąt rodzinnych dla studentów spędzających ten czas z dala od domu.

    Ten wieczór stał się jedną z najbardziej lubianych tradycji Federacji: to okazja, by zwolnić na koniec semestru, zaśpiewać *kolędy* ze starymi i nowymi znajomymi i uczcić społeczność, którą zbudowaliśmy w całej Wielkiej Brytanii.

    Szczególne podziękowania kierujemy do [Roksana Dąbkowska](https://www.roksanadabkowska.com/about), pianistki z Guildhall School of Music and Drama, za akompaniament do naszych kolęd przez cały wieczór.
