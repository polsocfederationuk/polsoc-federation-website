          image_alt: { en: "Legimi", pl: "Legimi" }
        - name: "HEATPEX"
          image: "/assets/pbf/sponsors/heatpex.jpg"
          url: null
          image_alt: { en: "HEATPEX", pl: "HEATPEX" }
        - name: "ntfy"
          image: "/assets/pbf/sponsors/ntfy.png"
          url: null
          image_alt: { en: "ntfy", pl: "ntfy" }
        - name: "Stowarzyszenie Wspólnota Polska"
          image: "/assets/pbf/sponsors/wspolnota-polska.png"
          url: null
          image_alt: { en: "Stowarzyszenie Wspólnota Polska", pl: "Stowarzyszenie Wspólnota Polska" }
    - key: media-patrons
      order: 2
      heading: { en: "Media Patrons", pl: "Patroni medialni" }
      aria_label: { en: "Media patron logos", pl: "Logotypy patronów medialnych" }
      prev_label: { en: "Scroll media patrons backwards", pl: "Przewiń patronów medialnych wstecz" }
      next_label: { en: "Scroll media patrons forwards", pl: "Przewiń patronów medialnych dalej" }
      logos:
