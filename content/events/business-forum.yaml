# ===========================================================================
# POLISH BUSINESS FORUM 2026 — the current edition.
#
# Generated from the two live pages during the Phase 12 migration; no prose,
# alt text, partner logo, role or link was retyped. See
# docs/BUSINESS_FORUM_MIGRATION.md.
#
# This record uses the SAME shared event core as the standard events, so a
# later phase can build listing cards, the homepage timeline, archives, the
# sitemap and JSON-LD through one code path. The `business_forum:` extension
# below holds what only this family has, and only this family may have.
#
# One record per ANNUAL EDITION. The 2027 Forum is a NEW file
# (business-forum-2027.yaml), never an edit of this one.
# ===========================================================================

# ---- shared event core ----------------------------------------------------
slug: business-forum
event_family: polish-business-forum
template: business-forum          # the ONLY template this family may use
academic_year: "2025/26"
published: true
order: 1                          # the flagship leads the listing
flagship: true
show_in_listing: true
show_on_homepage: true
show_in_archive: true

# Quoted so YAML keeps them as strings: unquoted dates become JS Date objects
# whose stringification is timezone-dependent.
start_date: "2026-04-24"
end_date: "2026-04-25"           # the Forum runs over two days
date_precision: day

venue:
  name: { en: "London Business School", pl: "London Business School" }
  neighbourhood: null
  locality: { en: "London", pl: "Londyn" }
  country: "GB"

registration:
  state: none                      # the 2026 edition has been held
  type: null
  url: null
  email: null

# The Forum's hero shows no <img>: its backdrop is a CSS layer under the navy
# overlay. The IMAGE is edition-specific and lives in
# business_forum.branding.hero_backdrop below; the hero's geometry, overlay and
# clipping stay in css/pbf.css. `hero_image` is the STANDARD-event field for a
# hero photograph element, which this family does not have — hence null.
hero_image: null
card_image: "/assets/pbf/stage.jpg"         # the future listing card
og_image: "/assets/pbf/stage.jpg"

# Localised on this family: the live Polish page carries the Polish
# organisation name in its JSON-LD, unlike the standard events.
organiser:
  en: "Federation of Polish Student Societies UK"
  pl: "Federacja Polskich Stowarzyszeń Studenckich w Wielkiej Brytanii"
co_organisers: []

# Named in the live JSON-LD. Personal names are never translated.
performers:
  - name: "Jan Krzysztof Bielecki"
    type: Person
  - name: "Norman Davies"
    type: Person
  - name: "Marcin Piątkowski"
    type: Person

# ===========================================================================
# BUSINESS FORUM EXTENSION — permitted ONLY on event_family:
# polish-business-forum. The validator rejects it on any standard record.
# ===========================================================================
business_forum:

  edition:
    number: 1                      # the inaugural edition
    ordinal: { en: "Inaugural", pl: "Pierwsza" }

  # Branding is structural. A marketing officer supplies the artwork and the
  # words; the geometry, watermark placement and lock-up rules are CSS.
  branding:
    logo: "/assets/pbf/pbf-logo-full.png"
    logo_alt: "Polish Business Forum"   # the wordmark reads the same in both languages
    tagline: "Polish Golden Age: From Emerging to Leading"
    # EDITION-SPECIFIC, not permanent branding: this is the 2026 team on the LBS
    # main stage — the same photograph used for the OG card, the listing card and
    # the first story tile. A 2027 edition supplies its own here and needs no CSS
    # change. The template passes it to css/pbf.css as --pbf-hero-backdrop, which
    # falls back to this same file so the un-migrated live pages are unaffected.
    hero_backdrop: "/assets/pbf/stage.jpg"
    # Watermarks: the hero and year marks are language-neutral; the people
    # section's mark is a translated word.
    watermark_hero: "PBF"
    watermark_story: "2026"
    watermark_people: { en: "FOUNDERS", pl: "ZAŁOŻYCIELE" }

  # Attendance is stored ONCE here and read by both the facts bar and the
  # statistics band, so the two can never disagree.
  attendance:
    count: 300
    suffix: "+"
    noun: { en: "guests", pl: "gości" }

  # Hero facts bar. Date and venue values are GENERATED from the canonical
  # fields above; attendance and edition come from this extension. Only the
  # labels are stored, because only the labels are language-specific.
  facts:
    date_label: { en: "Date", pl: "Data" }
    venue_label: { en: "Venue", pl: "Miejsce" }
    attendance_label: { en: "Attendance", pl: "Frekwencja" }
    edition_label: { en: "Edition", pl: "Edycja" }

  # The navy band. `count`/`suffix`/`plain` drive js/main.js's animated
  # counters; `plain` suppresses thousands separators for year-like numbers
  # (no stat needs it this edition, but the homepage's Est. 2013 counter does,
  # so the flag is supported rather than dropped).
  statistics:
    background: "/assets/pbf/networking-hero.jpg"
    eyebrow: { en: "The Forum in numbers", pl: "Forum w liczbach" }
    items:
      - count: 300
        suffix: "+"
        plain: false
        label: { en: "Attendees", pl: "Uczestników" }
      - count: 2
        suffix: null
        plain: false
        label: { en: "Days of programme", pl: "Dni programu" }
      - count: 40
        suffix: "+"
        plain: false
        label: { en: "Speakers", pl: "Prelegentów" }
      - value: { en: "Grand Ball", pl: "Wielki Bal" }   # a text stat, not a counter
        label: { en: "Black tie at The Landmark London", pl: "Black tie w The Landmark London" }

  # The two story galleries that bracket the write-up. Image paths, order and
  # tile widths are shared; only alt text is localised. The strips' spacing is
  # NOT here — it is fixed layout, set by the template, so no CSS reaches the
  # CMS surface.
  galleries:
    - images:
        - src: "/assets/pbf/stage.jpg"
          wide: true
          alt: { en: "The Polish Business Forum team on the main stage at London Business School", pl: "Zespół Polish Business Forum na głównej scenie w London Business School" }
        - src: "/assets/pbf/audience.jpg"
          wide: false
          alt: { en: "A full audience during a Polish Business Forum session", pl: "Pełna widownia podczas sesji Polish Business Forum" }
    - images:
        - src: "/assets/pbf/finance-panel.jpg"
          wide: true
          alt: { en: "The finance panel on stage at Polish Business Forum 2026", pl: "Panel finansowy na scenie Polish Business Forum 2026" }
        - src: "/assets/pbf/bielecki.jpg"
          wide: false
          alt: { en: "Former Prime Minister Jan Krzysztof Bielecki in conversation at the Forum", pl: "Były premier Jan Krzysztof Bielecki podczas rozmowy na Forum" }

  # Founders and project leaders, in the live order. Names are never
  # translated; roles are. The live photo alt IS the person's name.
  #
  # "Founder" renders as "współzałożyciel" (co-founder) throughout, because the
  # Forum has five of them — that is the wording the live Polish page already
  # uses for Szymon Kwidziński's IDENTICAL English role, and for Marek Świątek
  # and Michał Kobus. Nikodem Rajpold's role was left untranslated on the live
  # page; it now matches Szymon's, since the English is character-for-character
  # the same.
  people:
    - name: "Szymon Kwidziński"
      photo: "/assets/team/szymon-kwidzinski.jpg"
      role: { en: "Project Leader & Founder", pl: "Lider projektu i współzałożyciel" }
    - name: "Nikodem Rajpold"
      photo: "/assets/team/nikodem-rajpold.jpg"
      role: { en: "Project Leader & Founder", pl: "Lider projektu i współzałożyciel" }
    - name: "Ewa Borys"
      photo: "/assets/team/ewa-borys.jpg"
      role: { en: "Project Leader", pl: "Liderka projektu" }
    - name: "Marek Świątek"
      photo: "/assets/team/marek-swiatek.jpg"
      role: { en: "Founder", pl: "Współzałożyciel" }
    - name: "Michał Kobus"
      photo: "/assets/team/michal-kobus.jpg"
      role: { en: "LBS Coordinator & Founder", pl: "Koordynator LBS i współzałożyciel" }

  people_photo_row:
    - src: "/assets/pbf/project-leaders.jpg"
      alt: { en: "The Polish Business Forum project leaders on stage", pl: "Liderzy projektu Polish Business Forum na scenie" }
      caption: { en: "Project leaders", pl: "Liderzy projektu" }
    - src: "/assets/pbf/team-steps.jpg"
      alt: { en: "The Polish Business Forum team photographed at dusk", pl: "Zespół Polish Business Forum na zdjęciu o zmierzchu" }
      caption: { en: "The Forum team", pl: "Zespół Forum" }

  # Sponsors and media patrons. Each logo is stored exactly ONCE.
  #
  # The live carousel repeats the tile set in the DOM for a seamless loop, but
  # that repetition is NOT content and is not configured here — it is IT-owned
  # machinery in src/_data/businessForumTechnical.js, because it exists only
  # because js/main.js wraps at scrollWidth / 2. Editing a partner list must
  # never require thinking about it.
  partner_groups:
    - key: sponsors
      order: 1
      heading: { en: "Sponsors", pl: "Sponsorzy" }
      aria_label: { en: "Sponsor logos", pl: "Logotypy sponsorów" }
      prev_label: { en: "Scroll sponsors backwards", pl: "Przewiń sponsorów wstecz" }
      next_label: { en: "Scroll sponsors forwards", pl: "Przewiń sponsorów dalej" }
      logos:
        - name: "London Business School"
          image: "/assets/pbf/sponsors/lbs.jpg"
          url: null
          image_alt: { en: "London Business School", pl: "London Business School" }
        - name: "PKO Bank Polski"
          image: "/assets/pbf/sponsors/pko-bp.jpg"
          url: null
          image_alt: { en: "PKO Bank Polski", pl: "PKO Bank Polski" }
        - name: "Bank Pekao"
          image: "/assets/pbf/sponsors/bank-pekao.png"
          url: null
          image_alt: { en: "Bank Pekao", pl: "Bank Pekao" }
        - name: "VeloBank"
          image: "/assets/pbf/sponsors/velobank.png"
          url: null
          image_alt: { en: "VeloBank", pl: "VeloBank" }
        - name: "OC&C Strategy Consultants"
          image: "/assets/pbf/sponsors/occ.webp"
          url: null
          image_alt: { en: "OC&C Strategy Consultants", pl: "OC&C Strategy Consultants" }
        - name: "Legimi"
