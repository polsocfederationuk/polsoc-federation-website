          image_alt: { en: "Comparic", pl: "Comparic" }
        - name: "StockWatch"
          image: "/assets/pbf/media/stockwatch.png"
          url: null
          image_alt: { en: "StockWatch", pl: "StockWatch" }
        - name: "FXMAG"
