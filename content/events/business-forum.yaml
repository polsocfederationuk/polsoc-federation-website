          image_alt: { en: "PAP Biznes", pl: "PAP Biznes" }
        - name: "Puls Biznesu"
          image: "/assets/pbf/media/puls-biznesu.png"
          url: null
          image_alt: { en: "Puls Biznesu", pl: "Puls Biznesu" }
        - name: "British Poles"
