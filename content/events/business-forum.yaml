          image_alt: { en: "Przegląd", pl: "Przegląd" }

  # Belongs to this family only. Another event would have to demonstrate the
  # same requirement before this is generalised.
  funding_acknowledgement:
    logo: "/assets/pbf/senat-polonia-2026.png"
    logo_alt: { en: "Senat–Polonia 2026", pl: "Senat–Polonia 2026" }
    text: { en: "Project co-financed as part of the care of the Senate of the Republic of Poland for the Polish diaspora and Poles abroad in 2026.", pl: "Projekt współfinansowany w ramach sprawowania opieki Senatu Rzeczypospolitej Polskiej nad Polonią i Polakami za granicą w 2026 roku." }

  # Optional and edition-specific: `enabled: false` renders no section at all,
  # no heading and no placeholder. A future edition without a Ball sets that
  # flag rather than deleting the block.
  forum_ball:
    enabled: true
    image: "/assets/pbf/ball-polonez.jpg"
    image_alt: { en: "Guests dancing the polonez at the Polish Business Forum Ball", pl: "Goście tańczą poloneza na Balu Polish Business Forum" }
    caption: { en: "The polonez opens the Forum Ball", pl: "Polonez otwiera Bal Forum" }
    eyebrow: { en: "Day one, after dark", pl: "Pierwszy dzień, po zmroku" }
    title:
      en: { lead: "The Forum ", fancy: "Ball" }
      pl: { lead: "Bal ", fancy: "Forum" }
    body:
      # The live Polish page carries the ENGLISH ball copy. Translated here as an
      # approved bilingual correction — see docs/BUSINESS_FORUM_MIGRATION.md §7
      # and the addendum in docs/EVENT_RECONCILIATION.md.
      #
      # "black tie" is kept, matching the statistics label the live Polish page
      # already uses ("Black tie w The Landmark London"). Brand, hotel and dance
      # names are proper nouns and are not translated.
      en: |
        The inaugural Polish Business Forum Ball brought delegates, speakers and partners together for a grand black-tie evening at The Landmark London — one of the capital's most storied five-star hotels.

        The night opened in true Polish tradition with the polonez, before dinner, speeches and dancing carried the Forum's conversations long past midnight. It was the moment the conference became a community.
      pl: |
        Pierwszy Bal Polish Business Forum zgromadził delegatów, prelegentów i partnerów podczas uroczystego wieczoru w formule black tie w The Landmark London, jednym z najbardziej znanych pięciogwiazdkowych hoteli w Londynie.

        Wieczór rozpoczął się zgodnie z polską tradycją polonezem. Następnie kolacja, przemówienia i tańce sprawiły, że rozmowy rozpoczęte podczas Forum trwały długo po północy. To był moment, w którym konferencja przerodziła się w prawdziwą społeczność.

  photographers:
    - name: "YoniVisuals"
      gallery_url: "https://yonivisuals49.pixieset.com/polishbusinessforum/"
      pin: "8409"
      tag: { en: "Photographer · Conference", pl: "Fotograf · Konferencja" }
      description: { en: "The official conference gallery. When downloading a photo, enter your own email address — the gallery PIN is", pl: "Oficjalna galeria konferencji. Przy pobieraniu zdjęcia podaj własny adres e-mail — PIN do galerii to" }
      link_label: { en: "Open the gallery", pl: "Otwórz galerię" }
    - name: "Stas Romanowski"
      gallery_url: "https://drive.google.com/drive/folders/1m8rpfCNRGF2NdbInmnFpiVEGzMBJsH4Q?usp=sharing"
      pin: null
      tag: { en: "Photographer · Conference + Ball", pl: "Fotograf · Konferencja i Bal" }
      description: { en: "Full coverage of both conference days and the Forum Ball at The Landmark London, available to browse and download on Google Drive.", pl: "Pełna relacja z obu dni konferencji i Balu Forum w The Landmark London, do przeglądania i pobrania na Google Drive." }
      # Left untranslated on the live page; now matches the first card's label.
      link_label: { en: "Open the gallery", pl: "Otwórz galerię" }

  calls_to_action:
    team:
      url: "team.html"
      text: { en: "And behind them stood the entire Federation committee — the officers and volunteers whose months of work on partnerships, marketing, logistics and events made the Forum possible.", pl: "A za nimi stał cały zarząd Federacji — członkowie i wolontariusze, których miesiące pracy nad partnerstwami, marketingiem, logistyką i wydarzeniami sprawiły, że Forum mogło się odbyć." }
      label: { en: "Meet the full team", pl: "Poznaj cały zespół" }

# ===========================================================================
# LOCALISED SHARED-CORE CONTENT
# ===========================================================================

en:
  # The event name. Rendered as the screen-reader-only <h1>, because the
  # visible title on this page is the logo lock-up, not text.
  title: "Polish Business Forum 2026"
  hero_eyebrow: "A flagship conference by the Federation of Polish Student Societies in the UK"
  back_link: "← All events"
  back_link_bottom: "← Back to all events"

  # Story section.
  story_body: |
    Polish Business Forum 2026 was the inaugural edition of a new flagship conference organised by the Federation of Polish Student Societies in the UK and hosted at London Business School on 24–25 April 2026.

    Building on the long-standing legacy of the Polish Economic Forum, the event brought together over 300 students, young professionals, business leaders, investors, entrepreneurs, policymakers, and academics to discuss Poland's growing role in the European and global economy. The conference was held under the theme *“Polish Golden Age: From Emerging to Leading”*, exploring how Poland can transform decades of rapid economic growth into lasting economic, technological, and geopolitical leadership.

    Over two days, participants engaged with a diverse programme of keynote speeches, panel discussions, workshops, networking events, a career fair, and the inaugural Polish Business Forum Ball. Discussions focused on technology and artificial intelligence, venture capital and entrepreneurship, capital markets, financial innovation, economic competitiveness, leadership development, and European security.

    ## World-class speakers

    The speaker lineup featured some of the most influential figures from business, finance, academia, and public life. Sessions included discussions with investors from Goldman Sachs, Morgan Stanley, PKO TFI, CVI and Bossalini Capital, technology leaders from Microsoft, Synerise and Creotech, senior representatives of financial institutions including KNF, VeloBank and EBRD, as well as leading economists, entrepreneurs, diplomats and public policy experts.

    > The programme also featured conversations with former Prime Minister Jan Krzysztof Bielecki, historian Sir Norman Davies and economist Marcin Piątkowski.

    A key objective of the conference was to strengthen connections between the Polish diaspora, the United Kingdom's leading universities, and Poland's business ecosystem. Participants represented institutions including London Business School, LSE, Oxford, Cambridge, Imperial College London and UCL, creating a unique platform for networking, career development and the exchange of ideas.

    Polish Business Forum 2026 demonstrated the ability of Polish students in the UK to organise a high-profile international event and created a new platform for promoting Poland's economic achievements, entrepreneurial talent and future ambitions on the global stage. As the next chapter in a tradition spanning more than a decade, the Forum established itself as one of the most significant Polish student-led business events held outside Poland.

  # Section headings.
  people_eyebrow: "The people behind the Forum"
  people_title: { lead: "Founders & project ", fancy: "leaders" }
  people_lead: "The Forum was imagined, founded and delivered by a small team of students who carried it from a first conversation to a 300-person international conference."
  partners_eyebrow: "Partners"
  partners_title: { lead: "Made possible by our ", fancy: "partners" }
  partners_lead: "The Forum's programme, career fair and Ball were brought to life by the organisations below. Use the arrows to browse each strip at your own pace."
  photographers_eyebrow: "Galleries & downloads"
  photographers_title: { lead: "Take the memories ", fancy: "home" }
  photographers_lead: "Both days were captured by two brilliant photographers. Browse their full galleries and download your photos below."

  # Listing and timeline copy, transcribed from the live events page and
  # homepage. Nothing renders these yet — the listing is a later phase.
  card_summary: "Over 300 students, professionals, investors and policymakers gathered under the theme “Polish Golden Age: From Emerging to Leading” — two days of keynotes, panels, a career fair and the inaugural Forum Ball."
  card_image_alt: "The Polish Business Forum team on the main stage at London Business School"
  timeline_title: "Polish Business Forum at LBS"
  timeline_summary: "Our largest event ever — 300+ attendees, world-class speakers and the inaugural Forum Ball."

  # SEO and social.
  seo_title: "Polish Business Forum 2026 | Federation of Polish Student Societies UK"
  seo_description: "Polish Business Forum 2026 at London Business School brought over 300 Polish students, professionals and business leaders together across two days in London."
  schema_description: "The inaugural Polish Business Forum at London Business School, bringing over 300 students, professionals and business leaders together under the theme “Polish Golden Age: From Emerging to Leading”."
  og_image_alt: "The Polish Business Forum team on the main stage at London Business School"

pl:
  # The event name. Rendered as the screen-reader-only <h1>, because the
  # visible title on this page is the logo lock-up, not text.
  title: "Polish Business Forum 2026"
  hero_eyebrow: "Flagowa konferencja Federacji Polskich Stowarzyszeń Studenckich w Wielkiej Brytanii"
  back_link: "← Wszystkie wydarzenia"
  back_link_bottom: "← Wróć do wszystkich wydarzeń"

  # Story section.
  story_body: |
    Polish Business Forum 2026 było pierwszą edycją nowej flagowej konferencji zorganizowanej przez Federację Polskich Stowarzyszeń Studenckich w Wielkiej Brytanii, która odbyła się w London Business School w dniach 24–25 kwietnia 2026 roku.

    Nawiązując do wieloletniego dorobku Polish Economic Forum, wydarzenie zgromadziło ponad 300 studentów, młodych profesjonalistów, liderów biznesu, inwestorów, przedsiębiorców, decydentów i naukowców, by rozmawiać o rosnącej roli Polski w gospodarce europejskiej i światowej. Konferencja odbyła się pod hasłem *“Polish Golden Age: From Emerging to Leading”* — szukaliśmy odpowiedzi na pytanie, jak Polska może przekuć dekady szybkiego wzrostu gospodarczego w trwałe przywództwo gospodarcze, technologiczne i geopolityczne.

    Przez dwa dni uczestnicy brali udział w bogatym programie wykładów, paneli dyskusyjnych, warsztatów, spotkań networkingowych, targów pracy oraz pierwszego Balu Polish Business Forum. Rozmowy dotyczyły technologii i sztucznej inteligencji, venture capital i przedsiębiorczości, rynków kapitałowych, innowacji finansowych, konkurencyjności gospodarczej, rozwoju przywództwa oraz bezpieczeństwa europejskiego.

    ## Prelegenci światowej klasy

    Wśród prelegentów znalazły się jedne z najbardziej wpływowych postaci świata biznesu, finansów, nauki i życia publicznego. W sesjach brali udział inwestorzy z Goldman Sachs, Morgan Stanley, PKO TFI, CVI i Bossalini Capital, liderzy technologiczni z Microsoft, Synerise i Creotech, przedstawiciele instytucji finansowych, w tym KNF, VeloBank i EBRD, a także czołowi ekonomiści, przedsiębiorcy, dyplomaci i eksperci polityk publicznych.

    > W programie znalazły się również rozmowy z byłym premierem Janem Krzysztofem Bieleckim, historykiem sir Normanem Daviesem i ekonomistą Marcinem Piątkowskim.

    Kluczowym celem konferencji było wzmocnienie więzi między Polonią, czołowymi brytyjskimi uczelniami i polskim ekosystemem biznesowym. Uczestnicy reprezentowali między innymi London Business School, LSE, Oxford, Cambridge, Imperial College London i UCL, tworząc wyjątkową przestrzeń do budowania kontaktów, rozwoju zawodowego i wymiany myśli.

    Polish Business Forum 2026 pokazało, że polscy studenci w Wielkiej Brytanii potrafią zorganizować międzynarodowe wydarzenie najwyższej rangi, i stworzyło nową platformę promowania polskich osiągnięć gospodarczych, talentów przedsiębiorczych i ambicji na arenie międzynarodowej. Jako kolejny rozdział ponad dziesięcioletniej tradycji Forum ugruntowało swoją pozycję jako jedno z najważniejszych polskich studenckich wydarzeń biznesowych poza granicami kraju.

