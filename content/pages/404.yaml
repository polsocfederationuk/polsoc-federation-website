# 404 page content.
#
# These pages are deliberately NOT ordinary indexable page pairs:
#   - noindex, follow
#   - no canonical, no hreflang, no Open Graph
#   - absent from sitemap.xml
# See docs/STATIC_PAGES_MIGRATION.md §8 for why.
#
# Every destination below is ROOT-RELATIVE and stored WITHOUT the /pl/ prefix.
# The build adds the prefix per locale. A 404 can be served for any missing URL
# at any depth (/a/b/c/nope), so a page-relative link would resolve against that
# imaginary directory and break. See §9.

slug: "404"
published: true
noindex: true

# The two hero buttons and the three "where to next" cards, as bare page files.
# The build turns each into "/<file>" or "/pl/<file>".
primary_destination: "index.html"
secondary_destination: "contact.html"

cards:
  - key: events
    destination: "events.html"
  - key: news
    destination: "announcements.html"
  - key: members
    destination: "members.html"

