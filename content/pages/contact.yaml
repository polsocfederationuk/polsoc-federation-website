# Contact page content.
#
# Fields above the `en:`/`pl:` blocks are shared: one destination, one address,
# one set of handles, used by both languages. Only wording is localised.
#
# The address wording is transcribed EXACTLY from the live pages. It is
# described as a "Correspondence address" / "Adres korespondencyjny" — not an
# office and not a registered address. Do not reword it: whether this address
# also belongs in the homepage Organization JSON-LD is a separate, unresolved
# question and is deliberately not settled here.

slug: contact
published: true

contact_email: "contact@polsocfederation.pl"

# Address lines are shared EXCEPT the organisation name and the country, which
# are written differently in each language. The street and city lines are a
# postal address and are identical in both.
address:
  street_lines:
    - "238-246 King St"
    - "London W6 0RF"

social_links:
  - key: instagram
    url: "https://www.instagram.com/federac_ja/"
    label: "Instagram"
    handle: "@federac_ja"
  - key: linkedin
    url: "https://www.linkedin.com/company/federation-of-polish-student-societies-in-the-uk"
    label: "LinkedIn"
    handle: "Federation of Polish Student Societies"
  - key: facebook
    url: "https://www.facebook.com/FederationOfPolishStudentSocietiesUK/"
    label: "Facebook"
    handle: "FederationOfPolishStudentSocietiesUK"

# The Federation's own initiatives, each with its own set of links.
# `icon` names an inline SVG defined in partials/contact-icons.njk — the icon
# identifier is shared; only the visible label is localised.
initiatives:
  - key: polish-business-forum
    logo: "/assets/pbf/pbf-logo-icon.jpg"
    title: "Polish Business Forum"
    links:
      - icon: linkedin
        url: "https://www.linkedin.com/company/polishbusinessforum/"
        external: true
        label_key: linkedin
      - icon: instagram
        url: "https://www.instagram.com/polishbusinessforum/"
        external: true
        label_key: instagram
  - key: the-lambert
    logo: "/assets/pbf/media/lambert.webp"
    title: "The Lambert"
    links:
      - icon: mail
        url: "mailto:contact@thelambert.org"
        external: false
        label_key: email
      - icon: globe
        url: "https://thelambert.org/"
        external: true
        label_key: website
      - icon: instagram
        url: "https://www.instagram.com/thelambert_/"
        external: true
        label_key: instagram
      - icon: linkedin
        url: "https://www.linkedin.com/company/thelambert"
        external: true
        label_key: linkedin

