  timeline_title: { lead: "Dwanaście miesięcy", fancy: "wspólnoty" }

  # --- featured event -----------------------------------------------------
  featured_eyebrow: "Wydarzenie roku"
  featured_title: { lead: "Polish Business Forum", fancy: "2026" }
  # The Forum theme is a protected name and stays English in both languages.
  featured_lead_before: "Ponad 300 studentów, profesjonalistów i liderów spotkało się w London Business School pod hasłem"
  featured_lead_emphasis: "„Polish Golden Age: From Emerging to Leading”"
  featured_lead_after: "— z prelegentami z Goldman Sachs, Microsoft, EBRD i wielu innych."
  featured_label: "Poznaj Forum"

  # --- testimonials -------------------------------------------------------
  testimonials_eyebrow: "Co mówią o nas"

