en:
  title: "Case workshop at OC&C Strategy Consultants"
  subtitle: "Real casework and networking at OC&C's London headquarters."
  body: |
    We are excited to invite you to an exclusive case workshop hosted by the Polish office of OC&C Strategy Consultants, taking place at their London headquarters.

    If you are interested in strategy consulting, want to sharpen your case-solving skills, or are considering applying for consulting roles — this event is for you. It is a fantastic opportunity to ask questions, experience real casework and connect directly with professionals in the industry.

    Thursday 23 October · 15:30 · OC&C offices, London — with drinks and networking to follow the workshop.

    Space is limited.

