    Z przyjemnością zapraszamy na kameralne warsztaty case study prowadzone przez polskie biuro OC&C Strategy Consultants w ich londyńskiej siedzibie.

    Jeśli interesuje Cię doradztwo strategiczne, chcesz podszlifować umiejętność rozwiązywania case'ów albo myślisz o aplikowaniu do firm doradczych — to wydarzenie jest dla Ciebie. To świetna okazja, by zadać pytania, zmierzyć się z prawdziwym case'em i porozmawiać bezpośrednio z osobami z branży.

    Czwartek 23 października · 15:30 · biuro OC&C, Londyn — po warsztatach drinki i networking.

