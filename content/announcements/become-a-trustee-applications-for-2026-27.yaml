en:
  title: "Become a trustee: applications for 2026/27 are open"
  subtitle: "Five board roles open to ambitious Polish students across the UK."
  body: |
    The Federation helped shape the careers of the people who came before you. Now it is your turn.

    We are recruiting our 2026/27 board — five trustee roles open to ambitious Polish students across the UK who want to do something that actually matters:

    President · Vice-President · Head of Marketing · Head of Partnerships · Head of Legal & Finance

    It is demanding. It is real. And it will push you further than any classroom will.

    Applications close on 19 July. You can find out more about what each position involves [on our Instagram](https://www.instagram.com/p/DafxJ5ejGF4/?img_index=1).

pl:
  title: "Zostań powiernikiem: nabór na rok 2026/27 otwarty"
  subtitle: "Pięć funkcji w zarządzie dla ambitnych polskich studentów z całej Wielkiej Brytanii."
  body: |
    Federacja pomogła ukształtować kariery tych, którzy byli przed Tobą. Teraz Twoja kolej.

    Szukamy zarządu na rok 2026/27 — pięć funkcji powierniczych dla ambitnych polskich studentów z całej Wielkiej Brytanii, którzy chcą robić coś, co naprawdę ma znaczenie:

    Prezes · Wiceprezes · Szef ds. marketingu · Szef ds. partnerstw · Szef ds. prawnych i finansów

    To wymagające zadanie. Prawdziwe. I rozwinie Cię bardziej niż niejedne zajęcia.

    Nabór trwa do 19 lipca. Więcej o tym, czym zajmuje się każda z funkcji, znajdziesz [na naszym Instagramie](https://www.instagram.com/p/DafxJ5ejGF4/?img_index=1).
