en:
  title: "Honorary Patrons of NeoQuartet's concerts in Oxford"
  subtitle: "The internationally recognised NeoQuartet returns for the January New Music Weekend."
  body: |
    We are honoured to serve as Honorary Patron of NeoQuartet's two concerts in Oxford.

    The internationally recognised NeoQuartet returns on 17 January as part of the January New Music Weekend III, with two concerts at the Pavilion and the Jacqueline du Pré Music Building.

    Tickets and further details are available via Oxford University events.
  link_label: "Tickets & details"

pl:
  title: "Patronat honorowy nad koncertami NeoQuartet w Oksfordzie"
  subtitle: "Uznany na świecie NeoQuartet wraca na January New Music Weekend."
  body: |
    Z zaszczytem objęliśmy patronat honorowy nad dwoma koncertami NeoQuartet w Oksfordzie.

    Uznany na świecie NeoQuartet wraca 17 stycznia w ramach January New Music Weekend III — z dwoma koncertami w Pavilion i Jacqueline du Pré Music Building.

    Bilety i szczegóły dostępne są przez serwis wydarzeń Uniwersytetu Oksfordzkiego.
  link_label: "Bilety i szczegóły"
