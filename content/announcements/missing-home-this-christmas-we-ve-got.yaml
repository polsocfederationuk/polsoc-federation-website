pl:
  title: "Tęsknisz za domem w święta? Mamy coś dla Ciebie"
  subtitle: "Dołącz do naszej dorocznej Kolacji Wigilijnej w Ognisku Polskim 8 grudnia."
  body: |
    Tęsknisz za domem w święta? Mamy coś dla Ciebie.

    Dołącz do nas na niezapomniany wieczór w restauracji Ognisko Polskie w poniedziałek 8 grudnia — z drinkiem powitalnym w cenie i świąteczną kolacją, która przeniesie Cię prosto do polskiego stołu wigilijnego.

    Pula biletów w niższej cenie była ograniczona — takie zawsze znikają błyskawicznie!
  link_label: "Zobacz wydarzenie"
