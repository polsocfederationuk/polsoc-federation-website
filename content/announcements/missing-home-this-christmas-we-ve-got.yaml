  title: "Missing home this Christmas? We've got you covered"
  subtitle: "Join our annual Christmas Dinner at Ognisko on 8 December."
  body: |
    Missing home this Christmas? We've got you covered.

    Join us for an unforgettable evening at the Ognisko Restaurant on Monday 8 December — complete with a complimentary welcome drink and a festive dinner that will transport you straight back to a Polish Christmas table.

    A limited number of early-bird tickets were released — they always go quickly!
