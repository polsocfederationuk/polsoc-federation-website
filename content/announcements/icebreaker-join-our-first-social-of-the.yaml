en:
  title: "Icebreaker: join our first social of the year!"
  subtitle: "Meet your Polish community — Thursday 16 October at Mamuśka!"
  body: |
    Join us for our first social of the academic year!

    An evening designed to bring together Polish students from across London — whether you are new to university life or returning for another exciting year, this is the perfect opportunity to connect, unwind and meet your Polish community.

    Thursday 16 October · 18:30 · Mamuśka!, London Waterloo.

    No tickets, no formalities — just come along and say cześć.
