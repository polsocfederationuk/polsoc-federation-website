pl:
  title: "Icebreaker: przyjdź na pierwsze spotkanie w roku!"
  subtitle: "Poznaj swoją polską społeczność — czwartek 16 października w Mamuśka!"
  body: |
    Zapraszamy na nasze pierwsze spotkanie towarzyskie w roku akademickim!

    To wieczór dla polskich studentów z całego Londynu — niezależnie od tego, czy dopiero zaczynasz studia, czy wracasz na kolejny rok, to idealna okazja, żeby się poznać, odpocząć i wejść do polskiej społeczności.

    Czwartek 16 października · 18:30 · Mamuśka!, londyńskie Waterloo.

    Bez biletów i formalności — po prostu przyjdź i powiedz cześć.
  link_label: "Zobacz wydarzenie"
